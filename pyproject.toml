[project]
name = "sis2"
version = "0.1.0"
description = "SIS2: GBIF -> Kafka (FastStream) -> Pandera -> pandas/NumPy -> SQLite3 -> EDA pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faststream[kafka]>=0.7.9",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pandera>=0.36.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
]
